<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#20130e">
    <title>LettrDrop</title>
    <style>
        /* LettrDrop palette: INK #20130e, BARK #4c2c21, WOOD #78462c,
           CLAY #ab6c46, SAND #d19e79, CREAM #f2e3c3 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #20130e;
            color: #f2e3c3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #4c2c21;
            border: 2px solid #78462c;
            padding: 32px;
            border-radius: 16px;
            max-width: 400px;
            width: 100%;
        }
        .logo { display: block; max-width: 220px; margin: 0 auto 20px; image-rendering: pixelated; }
        .brand { text-align: center; font-size: 14px; color: #d19e79; margin-bottom: 6px; letter-spacing: 1px; }
        h1 { font-size: 26px; margin-bottom: 20px; text-align: center; }
        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            background: #20130e;
            color: #f2e3c3;
            border: 2px solid #78462c;
            border-radius: 8px;
            font-size: 16px;
        }
        input::placeholder { color: #ab6c46; }
        input:focus { outline: none; border-color: #d19e79; }
        button {
            width: 100%;
            padding: 14px;
            background: #ab6c46;
            color: #20130e;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            margin-top: 12px;
        }
        button:hover { background: #d19e79; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .message { padding: 12px; margin: 0 0 16px; border-radius: 8px; font-size: 15px; line-height: 1.45; }
        .error   { background: #3a1c1c; color: #e3a3a8; border: 1px solid #c24d57; }
        .success { background: #1f2e29; color: #9ccabb; border: 1px solid #5f9e96; }
        .info    { background: #20130e; color: #d19e79; border: 1px solid #78462c; }
        .footer { margin-top: 20px; text-align: center; font-size: 13px; color: #d19e79; }
        .spinner {
            display: inline-block; width: 14px; height: 14px;
            border: 2px solid #d19e79; border-top-color: transparent; border-radius: 50%;
            animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Drop your logo PNG next to this file and uncomment:
        <img class="logo" src="logo.png" alt="LettrDrop"> -->
        <div class="brand">LETTRDROP</div>
        <h1 id="title"></h1>
        <div id="message"></div>

        <form id="passwordForm" class="hidden">
            <input type="password" id="newPassword" required minlength="6" autocomplete="new-password">
            <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password">
            <button type="submit" id="submitBtn"></button>
        </form>

        <div id="footer" class="footer"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cqayvdjtnuadvxxkvkmn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxYXl2ZGp0bnVhZHZ4eGt2a21uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI1MjI3NzEsImV4cCI6MjA3ODA5ODc3MX0.PgXU4xFGXhneDlvFAYI6TdRWK3JwvKYn-2R0a_p5HZM';

        const STRINGS = { no: {
            loading: 'Laster…',
            resetTitle: 'Nytt passord',
            newPassword: 'Nytt passord',
            confirmPassword: 'Gjenta passordet',
            resetButton: 'Lagre passord',
            updating: 'Lagrer…',
            mismatch: 'Passordene er ikke like.',
            tooShort: 'Passordet må ha minst 6 tegn.',
            leaked: 'Dette passordet har dukket opp i en datalekkasje et annet sted. Velg et annet passord.',
            samePassword: 'Det nye passordet må være forskjellig fra det gamle.',
            resetDone: 'Passordet er oppdatert! Du kan lukke denne siden og logge inn i LettrDrop med det nye passordet.',
            confirmTitle: 'E-post bekreftet',
            confirming: 'Bekrefter e-postadressen…',
            signupDone: 'E-postadressen er bekreftet! Du kan lukke denne siden og logge inn i LettrDrop.',
            changeDone: 'Den nye e-postadressen er bekreftet og nå i bruk. Du kan lukke denne siden og gå tilbake til LettrDrop.',
            changeHalf: 'Første bekreftelse er mottatt. Åpne lenken i e-posten som ble sendt til den andre adressen for å fullføre endringen.',
            errorTitle: 'Noe gikk galt',
            expired: 'Lenken er utløpt eller allerede brukt. Be om en ny fra appen.',
            invalid: 'Ugyldig lenke. Be om en ny fra appen.',
            generic: 'Noe gikk galt. Prøv igjen senere.',
            footer: 'Gå tilbake til appen for å fortsette.'
        }, en: {
            loading: 'Loading…',
            resetTitle: 'New password',
            newPassword: 'New password',
            confirmPassword: 'Repeat password',
            resetButton: 'Save password',
            updating: 'Saving…',
            mismatch: 'The passwords don\'t match.',
            tooShort: 'Password must be at least 6 characters.',
            leaked: 'This password has shown up in a data leak elsewhere. Please choose a different one.',
            samePassword: 'Your new password must be different from the old one.',
            resetDone: 'Password updated! You can close this page and log in to LettrDrop with your new password.',
            confirmTitle: 'Email confirmed',
            confirming: 'Confirming your email…',
            signupDone: 'Your email is confirmed! You can close this page and log in to LettrDrop.',
            changeDone: 'Your new email address is confirmed and now active. You can close this page and return to LettrDrop.',
            changeHalf: 'First confirmation received. Open the link in the email sent to your other address to finish the change.',
            errorTitle: 'Something went wrong',
            expired: 'This link has expired or was already used. Please request a new one from the app.',
            invalid: 'Invalid link. Please request a new one from the app.',
            generic: 'Something went wrong. Please try again later.',
            footer: 'Return to the app to continue.'
        } };

        const titleEl = document.getElementById('title');
        const messageDiv = document.getElementById('message');
        const passwordForm = document.getElementById('passwordForm');
        const submitBtn = document.getElementById('submitBtn');

        let T;
        function setLanguage(code) {
            T = STRINGS[code] || STRINGS.en;
            document.documentElement.lang = code === 'no' ? 'nb' : 'en';
            document.getElementById('footer').textContent = T.footer;
            document.getElementById('newPassword').placeholder = T.newPassword;
            document.getElementById('confirmPassword').placeholder = T.confirmPassword;
            submitBtn.textContent = T.resetButton;
        }

        // Start with the browser language; the player's game language
        // (user_metadata.locale) replaces it once the token is checked.
        setLanguage(/^(nb|nn|no)\b/i.test(navigator.language || '') ? 'no' : 'en');
        titleEl.textContent = T.loading;

        // Supabase puts tokens (or an error) in the URL fragment.
        const params = new URLSearchParams(window.location.hash.substring(1) || window.location.search.substring(1));
        const accessToken = params.get('access_token');
        const type = params.get('type');
        const errorCode = params.get('error_code');
        const infoMessage = params.get('message');

        // Don't leave the token sitting in the address bar / browser history.
        if (window.location.hash || window.location.search) {
            history.replaceState(null, '', window.location.pathname);
        }

        function showMessage(kind, text, title) {
            if (title) titleEl.textContent = title;
            messageDiv.innerHTML = '';
            const box = document.createElement('div');
            box.className = 'message ' + kind;
            box.textContent = text;  // textContent, never innerHTML, for anything server- or URL-derived
            messageDiv.appendChild(box);
        }

        function showSpinner(text) {
            messageDiv.innerHTML = '';
            const box = document.createElement('div');
            box.className = 'message info';
            const spin = document.createElement('span');
            spin.className = 'spinner';
            box.appendChild(spin);
            box.appendChild(document.createTextNode(text));
            messageDiv.appendChild(box);
        }

        // Maps Supabase Auth error responses to friendly text.
        function friendlyError(body) {
            const code = body && (body.error_code || body.code);
            const msg = String((body && (body.msg || body.message || body.error_description)) || '').toLowerCase();
            if (code === 'weak_password' || msg.includes('known to be weak')) return T.leaked;
            if (code === 'same_password' || msg.includes('should be different')) return T.samePassword;
            if (msg.includes('at least')) return T.tooShort;
            if (code === 'bad_jwt' || code === 'session_not_found' || msg.includes('expired') || msg.includes('invalid jwt')) return T.expired;
            return T.generic;
        }

        if (errorCode) {
            showMessage('error', errorCode === 'otp_expired' ? T.expired : T.invalid, T.errorTitle);
        } else if (!accessToken && infoMessage) {
            // Secure email change: the first of two links was accepted.
            showMessage('info', T.changeHalf, T.confirmTitle);
        } else if (!accessToken) {
            showMessage('error', T.invalid, T.errorTitle);
        } else if (type === 'recovery' || type === 'signup' || type === 'email_change') {
            start();
        } else {
            showMessage('error', T.invalid, T.errorTitle);
        }

        // Checks the token and loads the player (for their game language) before showing anything.
        async function start() {
            if (type !== 'recovery') showSpinner(T.confirming);
            let response;
            try {
                response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${accessToken}` }
                });
            } catch (err) {
                return showMessage('error', T.generic, T.errorTitle);
            }
            const body = await response.json().catch(() => ({}));
            if (!response.ok) {
                return showMessage('error', friendlyError(body), T.errorTitle);
            }

            const locale = body.user_metadata && body.user_metadata.locale;
            if (locale === 'no' || locale === 'en') setLanguage(locale);

            if (type === 'recovery') {
                initPasswordReset();
            } else {
                // The link already confirmed the address; a valid session means it worked.
                showMessage('success', type === 'email_change' ? T.changeDone : T.signupDone, T.confirmTitle);
            }
        }

        function initPasswordReset() {
            titleEl.textContent = T.resetTitle;
            passwordForm.classList.remove('hidden');

            passwordForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (newPassword !== confirmPassword) return showMessage('error', T.mismatch);
                if (newPassword.length < 6) return showMessage('error', T.tooShort);

                submitBtn.disabled = true;
                submitBtn.textContent = T.updating;
                messageDiv.innerHTML = '';

                try {
                    const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                        method: 'PUT',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${accessToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ password: newPassword })
                    });

                    if (response.ok) {
                        passwordForm.classList.add('hidden');
                        showMessage('success', T.resetDone);
                        // End the one-off recovery session; the player signs in fresh in the app.
                        fetch(`${SUPABASE_URL}/auth/v1/logout`, {
                            method: 'POST',
                            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${accessToken}` }
                        }).catch(() => {});
                    } else {
                        const body = await response.json().catch(() => ({}));
                        showMessage('error', friendlyError(body));
                        submitBtn.disabled = false;
                        submitBtn.textContent = T.resetButton;
                    }
                } catch (err) {
                    showMessage('error', T.generic);
                    submitBtn.disabled = false;
                    submitBtn.textContent = T.resetButton;
                }
            });
        }
    </script>
</body>
</html>
